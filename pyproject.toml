[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "emailsyntax"
version = "1.0.0"
description = "Syntax-only email address validation and normalization, zero dependencies, no DNS or network"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Javier Lianes", email = "javier@lianes8studio.com" }]
keywords = ["email", "validation", "syntax", "normalize", "rfc", "no-dns"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = []

[project.scripts]
emailsyntax = "emailsyntax._cli:main"

[project.optional-dependencies]
dev = ["ruff", "mypy", "pytest", "pytest-timeout", "build", "twine"]

[project.urls]
Homepage = "https://lianes8studio.com"
Repository = "https://github.com/JaviLianes8/emailsyntax"
Source = "https://github.com/JaviLianes8/emailsyntax"
Issues = "https://github.com/JaviLianes8/emailsyntax/issues"
Changelog = "https://github.com/JaviLianes8/emailsyntax/blob/main/CHANGELOG.md"
LinkedIn = "https://www.linkedin.com/in/jlianes/"
Funding = "https://buymeacoffee.com/jlianesglrs"

[tool.hatch.build.targets.wheel]
packages = ["src/emailsyntax"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/sources/MANIFEST.json", "/scripts/fetch_sources.py", "/README.md", "/GUIDE.md", "/CHANGELOG.md", "/LICENSE", "/pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
timeout = 300
